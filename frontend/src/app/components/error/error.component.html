<div class="container my-5">

  <div class="error-box text-center">

    <div class="error-icon mb-4">
      <span class="warning-icon">⚠</span>
    </div>

    <h1 class="mb-3 title">
      Oops! Something Went Wrong
    </h1>

    <p class="subtitle mb-4">
      {{ errorMessage }}
    </p>

    <button class="btn-main mt-2" (click)="goHome()">
      Back to Home
    </button>

  </div>

</div>
