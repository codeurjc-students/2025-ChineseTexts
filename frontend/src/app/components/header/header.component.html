<!-- Modal de Login -->
<div *ngIf="!loginService.isLogged()" class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="justify-content: center;">
    <div class="modal-content login-form-container bg-light rounded-3 shadow-lg">

      <div class="modal-header border-0 pb-0">
        <h4 class="modal-title w-100 text-center mb-0">Login</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body pt-3">
        <form (ngSubmit)="login()">
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input
              [(ngModel)]="loginEmail"
              name="loginEmail"
              type="email"
              class="form-control"
              id="loginEmail"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input
              [(ngModel)]="loginPassword"
              name="loginPassword"
              type="password"
              class="form-control"
              id="loginPassword"
              placeholder="Enter your password"
              required
            />
          </div>

          <div class="text-danger mb-3 text-center">
            <!-- Aquí podrías mostrar mensajes de error si luego conectas lógica -->
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-danger">Login</button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
