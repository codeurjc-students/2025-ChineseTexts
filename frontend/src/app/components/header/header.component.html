<!-- Modal de Login — sin <form> para evitar submit nativo -->
<div *ngIf="!(isLoggedIn$ | async)" class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="justify-content: center;">
    <div class="modal-content login-form-container bg-light rounded-3 shadow-lg">

      <div class="modal-header border-0 pb-0">
        <h4 class="modal-title w-100 text-center mb-0">Login</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body pt-3">

        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email</label>
          <input
            [(ngModel)]="loginEmail"
            name="loginEmail"
            type="email"
            class="form-control"
            [class.is-invalid]="loginAttempted && emailError"
            id="loginEmail"
            placeholder="Enter your email"
            (keydown.enter)="login()"
          />
          <div class="invalid-feedback" *ngIf="loginAttempted && emailError">
            {{ emailError }}
          </div>
        </div>

        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <input
            [(ngModel)]="loginPassword"
            name="loginPassword"
            type="password"
            class="form-control"
            [class.is-invalid]="loginAttempted && passwordError"
            id="loginPassword"
            placeholder="Enter your password"
            (keydown.enter)="login()"
          />
          <div class="invalid-feedback" *ngIf="loginAttempted && passwordError">
            {{ passwordError }}
          </div>
        </div>

        <div class="text-danger mb-3 text-center" *ngIf="messageError">
          <i class="bi bi-exclamation-circle me-1"></i>{{ messageError }}
        </div>

        <div class="d-grid gap-2">
          <button type="button" class="btn btn-danger" (click)="login()">Login</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"
            (click)="loginAttempted = false; emailError = ''; passwordError = ''; messageError = ''">
            Cancel
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
