<button
  type="button"
  class="speak-btn"
  [class.speak-btn--sm]="size === 'sm'"
  [class.speak-btn--lg]="size === 'lg'"
  [class.is-playing]="state === 'playing'"
  [class.is-error]="state === 'error'"
  [attr.aria-label]="ariaLabel || ('speakButton.listen' | transloco)"
  [title]="state === 'error' ? ('speakButton.audioUnavailable' | transloco) : (ariaLabel || ('speakButton.listen' | transloco))"
  [disabled]="!text"
  (click)="toggle($event)"
>
  <span *ngIf="state === 'loading'" class="speak-spinner"></span>
  <i *ngIf="state !== 'loading'" class="bi" [ngClass]="icon"></i>
</button>
