<button
  type="button"
  class="speak-btn"
  [class.speak-btn--sm]="size === 'sm'"
  [class.speak-btn--lg]="size === 'lg'"
  [class.is-playing]="state === 'playing'"
  [class.is-error]="state === 'error'"
  [class.is-locked]="!isLogged || state === 'authRequired' || state === 'limitReached'"
  [attr.aria-label]="tooltip"
  [title]="tooltip"
  [disabled]="!text"
  (click)="toggle($event)"
>
  <span *ngIf="state === 'loading'" class="speak-spinner"></span>
  <i *ngIf="state !== 'loading'" class="bi" [ngClass]="icon"></i>
</button>
