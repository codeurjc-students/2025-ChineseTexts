<button type="button" class="password-toggle" (click)="toggle()"
        [attr.aria-label]="(visible ? 'common.password.hide' : 'common.password.show') | transloco"
        [attr.aria-pressed]="visible"
        [title]="(visible ? 'common.password.hide' : 'common.password.show') | transloco">
  <i class="bi" [class.bi-eye]="!visible" [class.bi-eye-slash]="visible" aria-hidden="true"></i>
</button>
