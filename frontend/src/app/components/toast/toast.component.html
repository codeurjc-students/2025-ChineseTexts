<div class="toast-wrap" *ngIf="current" role="status" aria-live="polite">
  <div class="toast-box">
    <span class="toast-text">{{ current.text }}</span>
    <span class="toast-actions">
      <button *ngFor="let a of current.actions" class="toast-action" (click)="runAction(a)">{{ a.label }}</button>
    </span>
    <button class="toast-close" (click)="dismiss()" aria-label="Close">✕</button>
  </div>
</div>
