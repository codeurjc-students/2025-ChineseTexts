<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- ══════════════════ PRIMARY SEO META ══════════════════ -->
  <!-- These are sensible defaults for the whole site. SeoService (Angular) then
       overrides title/description/canonical/OG per route on every navigation,
       including during server-side rendering, so crawlers get page-specific tags. -->
  <title>ChineseReads — Learn Chinese by Reading Graded HSK Texts</title>
  <meta name="description" content="Learn Chinese by reading graded texts adapted to your HSK level. Free instant pinyin and translations, natural audio pronunciation, and vocabulary flashcards. Start reading Chinese for free.">
  <meta name="keywords" content="learn chinese, chinese reads, chinese texts, learn chinese by reading, read chinese texts, learn chinese with graded texts, chinese graded readers, HSK reading practice, mandarin reading, chinese reading practice, learn mandarin, chinese pinyin translation, chinese flashcards">
  <meta name="author" content="ChineseReads">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="theme-color" content="#c0392b">
  <link rel="canonical" href="https://chinesereads.com/">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Icons & PWA manifest -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- ══════════════════ OPEN GRAPH (Facebook, WhatsApp, LinkedIn…) ══════════════════ -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ChineseReads">
  <meta property="og:title" content="ChineseReads — Learn Chinese by Reading Graded HSK Texts">
  <meta property="og:description" content="Learn Chinese by reading graded texts adapted to your HSK level. Free instant pinyin and translations, natural audio pronunciation, and vocabulary flashcards.">
  <meta property="og:url" content="https://chinesereads.com/">
  <meta property="og:image" content="https://chinesereads.com/icon-512.png">
  <meta property="og:locale" content="en_US">

  <!-- ══════════════════ TWITTER CARD ══════════════════ -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ChineseReads — Learn Chinese by Reading Graded HSK Texts">
  <meta name="twitter:description" content="Learn Chinese by reading graded texts adapted to your HSK level. Free instant pinyin, translations and audio pronunciation.">
  <meta name="twitter:image" content="https://chinesereads.com/icon-512.png">

  <!-- ══════════════════ STRUCTURED DATA (JSON-LD) ══════════════════ -->
  <!-- Helps Google understand the site as an educational web app and can enable
       rich results (sitelinks search box, organization knowledge panel). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://chinesereads.com/#website",
        "url": "https://chinesereads.com/",
        "name": "ChineseReads",
        "description": "Learn Chinese by reading graded HSK texts with instant translations and audio.",
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://chinesereads.com/texts?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "EducationalOrganization",
        "@id": "https://chinesereads.com/#organization",
        "name": "ChineseReads",
        "url": "https://chinesereads.com/",
        "logo": "https://chinesereads.com/icon-512.png",
        "sameAs": ["https://www.instagram.com/chinesereadsapp"]
      },
      {
        "@type": "WebApplication",
        "name": "ChineseReads",
        "url": "https://chinesereads.com/",
        "applicationCategory": "EducationApplication",
        "operatingSystem": "Any (web browser)",
        "inLanguage": "en",
        "description": "A free web app to learn Mandarin Chinese by reading graded texts from HSK 1 to HSK 6, with instant pinyin, translations, natural audio pronunciation and vocabulary flashcards.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    ]
  }
  </script>

  <!-- ══════════════════ THIRD-PARTY RESOURCES ══════════════════ -->
  <!-- preconnect speeds up the first byte from external hosts (better Core Web Vitals → SEO) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M6LFWC8Z2H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Consentimiento denegado por defecto hasta que el usuario acepte (RGPD)
    gtag('consent', 'default', {
      'analytics_storage': 'denied'
    });

    gtag('js', new Date());
    gtag('config', 'G-M6LFWC8Z2H', {
      'anonymize_ip': true
    });
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
