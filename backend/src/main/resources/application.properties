spring.application.name=backend
spring.mustache.suffix=.html
logging.level.org.springframework.web=DEBUG

spring.datasource.url=jdbc:mysql://localhost/chinesereads
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Permite subir imágenes (fotos de perfil, logos, imágenes de textos) de hasta 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

server.port=8080

ai.service.url=http://localhost:5001
ocr.service.url=http://localhost:5000
tts.service.url=http://localhost:5002

# Cost guards for user text generation (OCR + paste). Bound the maximum API spend.
# usage.user.monthly-limit: per-user creations allowed each calendar month.
# usage.global.daily-limit: total creations across ALL users per day (kill-switch).
usage.user.monthly-limit=30
usage.global.daily-limit=200