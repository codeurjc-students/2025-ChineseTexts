spring.application.name=backend
spring.mustache.suffix=.html
logging.level.org.springframework.web=DEBUG

spring.datasource.url=jdbc:mysql://localhost/chinesereads
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Permite subir imágenes (fotos de perfil, logos, imágenes de textos) de hasta 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

server.port=8080

ai.service.url=http://localhost:5001
ocr.service.url=http://localhost:5000
tts.service.url=http://localhost:5002

# Cost guards for user text generation (OCR + paste). Bound the maximum API spend.
# usage.user.monthly-limit: per-user creations allowed each calendar month (free plan).
# usage.premium.daily-limit: PREMIUM is unlimited monthly and exempt from the global
#   fuse; this high per-user daily fair-use cap only stops a single abusive account.
# usage.global.daily-limit: total FREE/admin creations across all users per day (fuse).
# All environment-overridable (docker/.env on the server) so limits can be tuned for
# a traffic spike — e.g. the day an influencer video takes off — without touching code.
usage.user.monthly-limit=${USAGE_USER_MONTHLY_LIMIT:10}
usage.premium.daily-limit=${USAGE_PREMIUM_DAILY_LIMIT:100}
usage.global.daily-limit=${USAGE_GLOBAL_DAILY_LIMIT:200}
# Max characters per user text: bounds per-generation cost and keeps full-text audio
# working (the TTS service caps at 1600 chars).
usage.text.max-chars=${USAGE_TEXT_MAX_CHARS:1500}

# Cost protection for the /api/tts endpoint (paid Google Cloud TTS per call). Audio is
# registered-only (see SecurityConfig); on top of that:
# tts.max-chars       — hard cap per request (blocks a single huge synthesis).
# tts.rate-limit.per-minute — max requests per client IP per minute (blocks hammering).
# tts.cache.*         — Caffeine cache of synthesized audio keyed by exact text,
#                       so identical input is never re-synthesized (biggest saving).
tts.max-chars=${TTS_MAX_CHARS:1600}
tts.rate-limit.per-minute=${TTS_RATE_LIMIT_PER_MINUTE:60}
tts.cache.max-entries=${TTS_CACHE_MAX_ENTRIES:1000}
tts.cache.ttl-days=${TTS_CACHE_TTL_DAYS:30}

# Per-user monthly audio quota for the FREE plan (premium and admins are exempt).
# Split by play type because they cost very differently: single words are cheap and
# the core reading interaction (high quota), while sentence/full-text narration is
# expensive and the premium draw (small quota).
usage.audio.word.monthly-limit=${USAGE_AUDIO_WORD_MONTHLY_LIMIT:100}
usage.audio.phrase.monthly-limit=${USAGE_AUDIO_PHRASE_MONTHLY_LIMIT:15}

# Per-user monthly quota for the AI contextual word chat (paid DeepSeek per message).
# Registered-only; a small free taste, premium/admins unlimited.
usage.chat.monthly-limit=${USAGE_CHAT_MONTHLY_LIMIT:10}

# Daily SRS review-reminder email (marketing: ONLY users with emailConsent=true and
# with flashcards due who have not read today; max one per user per day). The zone
# drives both the firing time and what "today" means for the due-count. Requires the
# Brevo credentials below; reminder.enabled is an independent kill switch.
reminder.enabled=${REMINDER_ENABLED:true}
reminder.cron=${REMINDER_CRON:0 0 18 * * *}
reminder.zone=${REMINDER_ZONE:Europe/Madrid}

# Password reset ("forgot my password") self-service flow. The emailed link carries a
# single-use random token whose SHA-256 hash is stored on the user; token-minutes is
# its lifetime. rate-limit.per-hour caps anonymous POST /api/auth/forgot-password
# requests per client IP (each valid request sends an email — protects mailboxes and
# the Brevo sending quota). Both environment-overridable (docker/.env on the server).
password-reset.token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:60}
password-reset.rate-limit.per-hour=${PASSWORD_RESET_RATE_LIMIT_PER_HOUR:5}

# Transactional email via Brevo (welcome email on signup). Empty by default so the
# app boots and runs normally with email disabled (same convention as Stripe).
# brevo.api-key  — Brevo API v3 key (xkeysib-...), from docker/.env on the server.
# mail.from      — verified sender address (the domain must pass SPF/DKIM in Brevo).
# mail.from-name — display name shown in inboxes.
brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:}
mail.from-name=${MAIL_FROM_NAME:ChineseReads}

# Stripe (PREMIUM subscription). All injected from the environment (docker/.env on the
# server) and empty by default so the app still boots locally without billing configured.
# stripe.secret-key / webhook-secret are SECRETS — never commit real values.
# stripe.price.* are the recurring Price IDs created in the Stripe dashboard.
# app.public-url is the site origin used to build Checkout success/cancel return URLs.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.monthly=${STRIPE_PRICE_MONTHLY:}
stripe.price.yearly=${STRIPE_PRICE_YEARLY:}
app.public-url=${APP_PUBLIC_URL:http://localhost:4200}

# JWT signing secret — a SECRET, never commit a real value. When set (>= 32 chars;
# generate with `openssl rand -base64 48`) the signing key is stable across restarts,
# so user sessions survive redeploys. Empty = random key per boot (dev/tests).
jwt.secret=${JWT_SECRET:}

# Influencer commission per COLLECTED charge (settlements view): €2 per monthly
# charge, €18 per yearly charge. Cents, overridable from the environment.
influencer.payout.monthly-cents=${INFLUENCER_PAYOUT_MONTHLY_CENTS:200}
influencer.payout.yearly-cents=${INFLUENCER_PAYOUT_YEARLY_CENTS:1800}