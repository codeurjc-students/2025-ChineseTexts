services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../frontend/dist/frontend/browser:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - app-network

  # Angular SSR for the individual text pages (/text/:id and /es/text/:id): the only
  # public routes with dynamic content, so the only ones Caddy proxies here — every
  # other page keeps being served as static/prerendered files exactly as before.
  # Runs the server bundle produced by `npm run build` (same dist/ Caddy mounts), so
  # deploy.sh needs no extra build step — it only force-recreates this container
  # (same stale-mount reason as Caddy). If this container is down, Caddy falls back
  # to the SPA shell: worst case equals the pre-SSR behavior.
  frontend-ssr:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server/server.mjs"]
    volumes:
      - ../frontend/dist/frontend:/app:ro
    environment:
      PORT: "4000"
      # Where the SSR render resolves relative /api calls (ssrBaseUrlInterceptor).
      API_BASE_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/chinesereads
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AI_SERVICE_URL: http://ai-service:5001
      OCR_SERVICE_URL: http://ocr-service:5000
      TTS_SERVICE_URL: http://tts-service:5002
      # Stripe (PREMIUM). Values live in docker/.env on the server (never committed);
      # empty defaults keep the app booting if billing is not configured yet.
      # Transactional email (Brevo). Empty defaults keep email disabled until set.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ChineseReads}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # JWT signing secret (docker/.env; generate with `openssl rand -base64 48`).
      # With it set, sessions survive redeploys; empty = new random key per boot.
      JWT_SECRET: ${JWT_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://chinesereads.com}
      # Daily SRS review-reminder email. Tune from docker/.env without code changes:
      # REMINDER_ENABLED=false to switch off, REMINDER_CRON to change the schedule
      # (e.g. "0 0 18 * * MON" = weekly), REMINDER_ZONE for the timezone. Deleting
      # the .env line restores these defaults on the next container restart.
      REMINDER_ENABLED: ${REMINDER_ENABLED:-true}
      REMINDER_CRON: ${REMINDER_CRON:-0 0 18 * * *}
      REMINDER_ZONE: ${REMINDER_ZONE:-Europe/Madrid}
      # Cost limits and fuses, tunable from docker/.env without touching code (same
      # convention as REMINDER_*: delete the .env line to restore these defaults).
      # The global generation fuse runs at 500/day here (app default is 200) as the
      # campaign posture: headroom for influencer publish days without a redeploy —
      # raise it further from .env (e.g. 1000) if a video takes off. Per-user free
      # limits are the freemium design: change them only as a business decision.
      USAGE_GLOBAL_DAILY_LIMIT: ${USAGE_GLOBAL_DAILY_LIMIT:-500}
      USAGE_USER_MONTHLY_LIMIT: ${USAGE_USER_MONTHLY_LIMIT:-10}
      USAGE_PREMIUM_DAILY_LIMIT: ${USAGE_PREMIUM_DAILY_LIMIT:-100}
      USAGE_TEXT_MAX_CHARS: ${USAGE_TEXT_MAX_CHARS:-1500}
      USAGE_AUDIO_WORD_MONTHLY_LIMIT: ${USAGE_AUDIO_WORD_MONTHLY_LIMIT:-100}
      USAGE_AUDIO_PHRASE_MONTHLY_LIMIT: ${USAGE_AUDIO_PHRASE_MONTHLY_LIMIT:-15}
      USAGE_CHAT_MONTHLY_LIMIT: ${USAGE_CHAT_MONTHLY_LIMIT:-10}
      TTS_MAX_CHARS: ${TTS_MAX_CHARS:-1600}
      TTS_RATE_LIMIT_PER_MINUTE: ${TTS_RATE_LIMIT_PER_MINUTE:-60}
      TTS_CACHE_MAX_ENTRIES: ${TTS_CACHE_MAX_ENTRIES:-1000}
      TTS_CACHE_TTL_DAYS: ${TTS_CACHE_TTL_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: chinesereads
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    networks:
      - app-network

  ocr-service:
    build:
      context: ../ocr-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ../ocr-service/credentials.json:/app/credentials.json:ro
    networks:
      - app-network

  tts-service:
    build:
      context: ../tts-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ../tts-service/credentials.json:/app/credentials.json:ro
    networks:
      - app-network

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge